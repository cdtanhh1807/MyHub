name: MyHub checks and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests (fake MongoDB and Drive)
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run build
      - name: Browser checks
        working-directory: frontend
        run: |
          npx playwright install msedge
          npm run dev > ../data/ci-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          "$ready"
          npx playwright test
      - name: Package exact commit without local data or secrets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir package
          git archive "$GITHUB_SHA" | tar -x -C package
          mkdir -p package/frontend/dist
          cp -a frontend/dist/. package/frontend/dist/
          printf '%s\n' "$GITHUB_SHA" > package/RELEASE
          tar -czf "$GITHUB_SHA.tar.gz" -C package .
          sha256sum "$GITHUB_SHA.tar.gz" > "$GITHUB_SHA.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: release-${{ github.sha }}
          path: |
            ${{ github.sha }}.tar.gz
            ${{ github.sha }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: myhub-production
      cancel-in-progress: false
    steps:
      - name: Deploy only the current main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current" == "$GITHUB_SHA" ]]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; else echo 'Skip superseded release'; fi
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: release-${{ github.sha }}
      - name: Upload and activate release over verified SSH
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_PORT" =~ ^[0-9]+$ && "$DEPLOY_USER" == myhub ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/myhub_deploy
          chmod 600 ~/.ssh/myhub_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          opts=(-i ~/.ssh/myhub_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          scp -P "$DEPLOY_PORT" "${opts[@]}" "$GITHUB_SHA.tar.gz" "$GITHUB_SHA.tar.gz.sha256" "$DEPLOY_USER@$DEPLOY_HOST:/opt/myhub/incoming/"
          # Script cố định được root cài tại bootstrap, không chạy shell root từ artifact.
          ssh -p "$DEPLOY_PORT" "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "/usr/local/bin/myhub-release '$GITHUB_SHA'"
      - name: Check public route serves the deployed commit
        if: steps.latest.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --max-time 30 https://myhub.liamcao.io.vn/api/v1/health |
            python3 -c 'import json,os,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("release")==os.environ["RELEASE_SHA"] and d.get("status")=="ok" else 1)'

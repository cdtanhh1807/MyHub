# Nginx phục vụ build và API cùng hostname; cloudflared service gọi localhost:8080.
server {
    listen 127.0.0.1:8080 default_server;
    server_name myhub.liamcao.io.vn;
    root /opt/myhub/current/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 24m;

    # API giữ nguyên /api/v1; stream upload/download, không cache dữ liệu riêng tư.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 110s;
        proxy_send_timeout 110s;
        add_header Cache-Control "private, no-store" always;
    }

    # Tên bundle có hash: cache lâu; file thiếu phải 404 thay vì trả HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA/index/logo kiểm tra lại sau mỗi lần mở để nhận bản phát hành mới.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
